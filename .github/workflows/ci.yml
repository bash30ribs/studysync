name: CI / Quality & Verification Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Fast Linter (oxlint)
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Run TypeScript Type Check & Vite Production Build
        run: npm run build
